name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Valideer SemVer tagformaat
        run: |
          set -euo pipefail
          # Strikte SemVer: vMAJOR.MINOR.PATCH met optionele -PRERELEASE.
          # Geldig:   v0.1.0, v1.2.3, v2.0.0-rc1, v1.0.0-beta.2
          # Ongeldig: v01.0.0 (leading zero), v1.0 (incompleet),
          #           v1.0.0+sha (build metadata, niet ondersteund)
          regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! printf '%s\n' "$TAG_NAME" | grep -Eq "$regex"; then
            echo "Tag ${TAG_NAME} voldoet niet aan SemVer (vMAJOR.MINOR.PATCH[-PRERELEASE])." >&2
            echo "Voorbeeld: v0.1.0, v1.2.3 of v2.0.0-rc1." >&2
            exit 1
          fi

      - name: Haal changelog-sectie op
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Geen changelog-sectie gevonden voor ${version}." >&2
            echo "Voeg een sectie '## [${version}]' toe aan CHANGELOG.md." >&2
            exit 1
          fi

      - name: Maak GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file release-notes.md
