name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    name: Lint en formattering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  hugo-syntax:
    name: Hugo template syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Installeer Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.162.0"
          extended: false

      - name: Smoke build minimal site
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          theme_path="$PWD"
          cd "$work"
          hugo new site . --force --format=yaml >/dev/null
          cat > hugo.yaml <<EOF
          baseURL: https://example.test/
          title: Smoke test
          defaultContentLanguage: nl
          module:
            imports:
              - path: github.com/RijksICTGilde/hugo-theme-rijksoverheid
            replacements: "github.com/RijksICTGilde/hugo-theme-rijksoverheid -> ${theme_path}"
          EOF
          hugo mod init github.com/example/smoke
          hugo --minify --gc --logLevel info

  voorbeeldsite:
    name: Voorbeeldsite en laag 1 (Hugo ${{ matrix.hugo }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        hugo: ["0.162.0", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Extended is niet nodig: het theme gebruikt geen SCSS en Hugo codeert WebP zelf.
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ matrix.hugo }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Bouw de voorbeeldsite
        working-directory: exampleSite
        run: |
          set -euo pipefail
          hugo --minify --panicOnWarning --destination public
          hugo --minify --panicOnWarning --environment nieuw-venster --destination public-nieuw-venster

      - name: Laag 1 (regels en tests, zonder npm)
        working-directory: exampleSite
        run: node --test tests/*.test.js

      - name: Installeer htmltest
        env:
          HTMLTEST_VERSION: "0.17.0"
          HTMLTEST_SHA256: 775c597ee74899d6002cd2d93076f897f4ba68686bceabe2e5d72e84c57bc0fb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/htmltest.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/wjdp/htmltest/releases/download/v${HTMLTEST_VERSION}/htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          echo "${HTMLTEST_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" htmltest
          sudo install "$RUNNER_TEMP/htmltest" /usr/local/bin/htmltest
          htmltest --version

      - name: Interne links en ankers (htmltest)
        working-directory: exampleSite
        run: htmltest

  toegankelijkheid:
    name: Laag 2, toegankelijkheid en gedrag in de browser
    needs: voorbeeldsite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # De runner heeft Chrome al; puppeteer hoeft er geen te downloaden.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.162.0"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: exampleSite/package-lock.json

      - name: Installeer pa11y-ci en puppeteer
        run: npm ci --prefix exampleSite

      - name: Controleer Chrome
        run: google-chrome --version

      - name: Bouw de voorbeeldsite
        working-directory: exampleSite
        run: hugo --minify --panicOnWarning --destination public

      - name: Laag 2 (pa11y, WCAG 2.2, reflow en toetsenbord)
        run: npm run --prefix exampleSite laag2

  nldd:
    name: NLDD-bestanden kloppen met het designsysteem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Installeer de generator
        run: npm ci --prefix tools/nldd

      - name: Vergelijk de gegenereerde bestanden met de repo
        run: node tools/nldd/check.js
