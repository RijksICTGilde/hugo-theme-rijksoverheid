# Deze repository volgt de publiccode.yml-standaard om publieke
# software vindbaar te maken. Meer info: https://yml.publiccode.tools/
publiccodeYmlVersion: "0.4.0"

name: Hugo theme voor de Rijksoverheid
url: "https://github.com/RijksICTGilde/hugo-theme-rijksoverheid"

softwareType: "library"
platforms:
  - web

categories:
  - content-management
  - it-development

developmentStatus: beta

description:
  nl:
    shortDescription: >
      Hugo theme dat de visuele en functionele basis levert voor sites in
      de stijl van de Rijksoverheid.
    longDescription: >
      Dit Hugo theme biedt een herbruikbare basis voor het publiceren van
      websites in de visuele stijl van de Rijksoverheid. Het levert
      layouts, design tokens, componenten (cards, callouts, references,
      page banners, breadcrumbs, table of contents, zoek) en een
      JavaScript bundel met fuzzy search. Consumer sites brengen hun eigen
      content en optionele tokens en componenten mee.

      Toegepaste standaarden zijn semantische HTML, WCAG 2.2 AA, dark mode
      via prefers-color-scheme en CSP-vriendelijke asset bundling. Het
      theme is gepubliceerd onder de EUPL 1.2 en bedoeld voor hergebruik
      door overheidsorganisaties.
    features:
      - Layout en typografie in Rijksoverheid huisstijl
      - Design tokens via CSS custom properties
      - Herbruikbare componenten en shortcodes
      - Site brede zoekfunctie met Fuse.js
      - Dark mode en respect voor prefers-reduced-motion

legal:
  license: EUPL-1.2
  mainCopyrightOwner: RijksICTGilde
  repoOwner: RijksICTGilde

intendedAudience:
  countries:
    - NL
  scope:
    - government

localisation:
  localisationReady: false
  availableLanguages:
    - nl

maintenance:
  type: internal
  contacts:
    - name: RijksICTGilde
      affiliation: Ministerie van Binnenlandse Zaken en Koninkrijksrelaties

dependsOn:
  open:
    - name: Hugo Extended
      versionMin: "0.162.0"
    - name: Go
      versionMin: "1.26"
