maintenance:
  type: internal
  contacts:
    - name: RijksICTGilde
      affiliation: Ministerie van Binnenlandse Zaken en Koninkrijksrelaties

dependsOn:
  open:
    - name: Hugo
      versionMin: "0.162.0"
    - name: Go
      versionMin: "1.26"
