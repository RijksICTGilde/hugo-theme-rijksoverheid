# Deze repository volgt de publiccode.yml-standaard om publieke
# software vindbaar te maken. Meer info: https://yml.publiccode.tools/
publiccodeYmlVersion: "0"

name: Hugo theme voor de Rijksoverheid
url: "https://github.com/RijksICTGilde/hugo-theme-rijksoverheid"

softwareType: "library"
platforms:
  - web

categories:
  - content-management
  - it-development

developmentStatus: beta

organisation:
  name: Rijks ICT Gilde
  uri: "https://github.com/RijksICTGilde"

description:
  nl:
    shortDescription: >
      Hugo theme voor websites in de stijl van de Rijksoverheid, met de
      kleuren, het lettertype en de iconen van het NLDD Designsysteem.
    longDescription: >
      Dit Hugo theme is een herbruikbare basis voor websites in de stijl van
      de Rijksoverheid. Het levert layouts, de kleuren, het lettertype en de
      iconen van het NLDD Designsysteem, componenten (kaarten, infoblokken,
      een rechterkolom met inhoudsopgave, tabellen en Mermaid-diagrammen), een
      sitebrede zoekfunctie en uitvoer voor taalmodellen (llms.txt en Markdown
      per pagina). Sites brengen hun eigen inhoud mee en, waar nodig, een eigen
      stylesheet.

      Het theme mikt op WCAG 2.2 niveau AA, werkt onder een strikte Content
      Security Policy en doet geen verzoeken naar andere domeinen. De
      toegankelijkheid van een site en de toegankelijkheidsverklaring blijven
      de verantwoordelijkheid van die site.

      De code staat onder de EUPL 1.2. Het lettertype RijksSans, het Rijkslogo
      en de huisstijl zijn alleen bedoeld voor de Rijksoverheid; de README legt
      uit hoe een andere organisatie ze vervangt.
    features:
      - Kleuren, lettertype en iconen uit het NLDD Designsysteem
      - Licht en donker, met een keuze voor de bezoeker
      - Componenten en shortcodes voor kaarten, infoblokken en tabellen
      - Sitebrede zoekfunctie met Fuse.js, zonder externe dienst
      - Uitvoer voor taalmodellen en een RSS-feed met de volledige inhoud
      - Strikte Content Security Policy, zonder inline scripts of stijlen

legal:
  license: EUPL-1.2
  mainCopyrightOwner: RijksICTGilde

intendedAudience:
  countries:
    - NL
  scope:
    - government

localisation:
  localisationReady: false
  availableLanguages:
