# Configuratie voor pre-commit (https://pre-commit.com).
# Installeer met: pip install pre-commit && pre-commit install
# Handmatig draaien: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Gevendorde bestanden blijven bytegelijk aan het npm-pakket.
        exclude: ^assets/lib/.*\.min\.m?js$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        # layouts/*.json zijn Hugo-templates met {{ }} syntax, geen echte JSON.
        exclude: ^layouts/.*\.json$
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--fix]
        # Proefinhoud voor tests/markdown.test.js, met opzet afwijkend: een
        # codeblok met tildes en attribuutlijsten van Goldmark.
        exclude: ^exampleSite/content/onderdelen/proef-ankers-markdown/

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]
